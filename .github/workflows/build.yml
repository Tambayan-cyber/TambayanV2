#include <WiFi.h>
const char* ssid = "MakisigVendo";
const char* password = "12345678";
#define COIN_PIN 34
#define RELAY_PIN 26
int coinCount = 0;
bool internetOn = false;
unsigned long internetTimer = 0;
void setup() {
  Serial.begin(115200);
  pinMode(COIN_PIN, INPUT);
  pinMode(RELAY_PIN, OUTPUT);
  digitalWrite(RELAY_PIN, LOW);
  WiFi.softAP(ssid, password);
  Serial.println("Makisig Vendo Started!");
}
void loop() {
  if (digitalRead(COIN_PIN) == LOW) {
    delay(50);
    if (digitalRead(COIN_PIN) == LOW) {
      coinCount++;
      Serial.print("Coin: ");
      Serial.println(coinCount);
      while(digitalRead(COIN_PIN) == LOW) delay(10);
    }
  }
  if (coinCount > 0 && !internetOn) {
    internetOn = true;
    digitalWrite(RELAY_PIN, HIGH);
    internetTimer = millis();
  }
  if (internetOn && millis() - internetTimer > 300000) {
    internetOn = false;
    digitalWrite(RELAY_PIN, LOW);
    coinCount = 0;
  }
}
